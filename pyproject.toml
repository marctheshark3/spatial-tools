[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spatial-tools"
version = "0.1.0"
description = "Explicit 2D scene checks and bounded route planning for agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "third_party/*"]
authors = [{name = "spatial-tools contributors"}]
dependencies = ["shapely>=2.1.2,<3"]

[project.urls]
Homepage = "https://github.com/marctheshark3/spatial-tools"
Issues = "https://github.com/marctheshark3/spatial-tools/issues"

[project.scripts]
spatial-tools = "spatial_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]
docs = ["matplotlib>=3.10,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
